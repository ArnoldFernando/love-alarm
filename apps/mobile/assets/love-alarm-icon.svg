<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7E"/>
      <stop offset="55%" stop-color="#E8365E"/>
      <stop offset="100%" stop-color="#B41E4A"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE8ED"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#glow)"/>

  <!-- alarm bell feet (little legs like a classic alarm clock) -->
  <g stroke="#FFE8ED" stroke-width="26" stroke-linecap="round">
    <line x1="330" y1="330" x2="270" y2="270"/>
    <line x1="694" y1="330" x2="754" y2="270"/>
  </g>

  <!-- ringing pulse arcs -->
  <g stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 208 400 A 260 260 0 0 1 208 620"/>
    <path d="M 150 350 A 340 340 0 0 1 150 670"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 816 400 A 260 260 0 0 0 816 620"/>
    <path d="M 874 350 A 340 340 0 0 0 874 670"/>
  </g>

  <!-- heart body (the alarm's bell shape) -->
  <path d="M512 748
           C 320 610, 210 500, 210 380
           C 210 290, 282 224, 368 224
           C 428 224, 480 258, 512 312
           C 544 258, 596 224, 656 224
           C 742 224, 814 290, 814 380
           C 814 500, 704 610, 512 748 Z"
        fill="url(#heart)"/>

  <!-- clock hands inside the heart, ticking toward the alarm moment -->
  <g stroke="#E8365E" stroke-width="26" stroke-linecap="round">
    <line x1="512" y1="430" x2="512" y2="345"/>
    <line x1="512" y1="430" x2="572" y2="430"/>
  </g>
  <circle cx="512" cy="430" r="16" fill="#E8365E"/>

  <!-- small alarm bell knob on top of the heart -->
  <circle cx="512" cy="222" r="20" fill="#FFE8ED"/>
</svg>
