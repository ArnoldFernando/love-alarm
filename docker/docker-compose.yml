version: "3.9"

services:
  app:
    build:
      context: ../backend
      dockerfile: ../docker/php/Dockerfile
    container_name: la_app
    working_dir: /var/www
    volumes:
      - ../backend:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - lovealarm
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: la_webserver
    ports:
      - "8000:80"
    volumes:
      - ../backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lovealarm
    depends_on:
      - app

  db:
    image: postgis/postgis:15-3.4
    container_name: la_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lovealarm
      POSTGRES_USER: lovealarm
      POSTGRES_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - lovealarm

  redis:
    image: redis:7-alpine
    container_name: la_redis
    ports:
      - "6379:6379"
    networks:
      - lovealarm

  queue:
    build:
      context: ../backend
      dockerfile: ../docker/php/Dockerfile
    container_name: la_queue
    working_dir: /var/www
    volumes:
      - ../backend:/var/www
    command: php artisan queue:work --sleep=3 --tries=3
    networks:
      - lovealarm
    depends_on:
      - db
      - redis

  reverb:
    build:
      context: ../backend
      dockerfile: ../docker/php/Dockerfile
    container_name: la_reverb
    working_dir: /var/www
    volumes:
      - ../backend:/var/www
    command: php artisan reverb:start
    ports:
      - "8080:8080"
    networks:
      - lovealarm
    depends_on:
      - db
      - redis

volumes:
  dbdata:

networks:
  lovealarm:
    driver: bridge
